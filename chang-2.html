<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phần I: Nội dung bản vẽ nhà</title>
<style>
:root{--hlc:#d84315;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0e1b2e;--card:#fffbe8;--ink:#14243a;--acc:#ff8a00}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1f2a3d;--ink:#eef4ff;--hlc:#ffb74d}}
:root[data-theme="dark"]{--card:#1f2a3d;--ink:#eef4ff;--hlc:#ffb74d}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
canvas{display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
#nav{position:absolute;right:8px;top:38%;display:flex;flex-direction:column;gap:8px}
.b{border:2px solid var(--acc);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 10px;font:700 13px/1.2 system-ui;cursor:pointer;max-width:118px;text-align:left}
.b.on{background:var(--acc);color:#1b1200}
.hl{animation:hl 1s infinite}
@keyframes hl{50%{box-shadow:0 0 0 7px #ffb34799}}
#dlg{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:8px;align-items:flex-end}
#npc{width:84px;height:auto;flex:none;filter:drop-shadow(0 3px 3px #0006)}
#bx{flex:1;background:var(--card);color:var(--ink);border:3px solid var(--acc);border-radius:14px;padding:10px 34px 10px 12px;min-height:78px;position:relative;font-size:clamp(14px,3.5vw,17px);line-height:1.4}
#tx{white-space:pre-wrap}#tx b{color:var(--hlc);font-weight:800}#hd{display:none;font:800 12px system-ui;color:#fff;border-radius:8px;padding:2px 9px;margin-bottom:5px;width:fit-content}
#nx{position:absolute;right:8px;bottom:4px;border:0;background:none;color:var(--acc);font-size:22px;cursor:pointer;visibility:hidden;animation:hl .8s infinite}
#act{position:absolute;left:8px;right:134px;bottom:126px;display:flex;flex-wrap:wrap;gap:8px}
.lab{position:absolute;transform:translate(-50%,-50%);background:#000a;color:#fff;border-radius:8px;padding:2px 7px;font:700 12px system-ui;pointer-events:none;white-space:nowrap;display:none}
#mm{position:absolute;left:8px;top:8px;border:2px solid var(--acc);border-radius:8px;background:#fffbe8dd;display:none}
#end{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}
#end div{background:var(--card);color:var(--ink);border:3px solid var(--acc);border-radius:16px;padding:20px;max-width:360px;text-align:center;line-height:1.5}
#sheet{position:absolute;left:0;right:0;top:0;bottom:200px;display:none;align-items:center;justify-content:center;background:#000a;z-index:5;padding:6px}#sc2{max-width:100%;max-height:100%;background:#fffbe8;border:3px solid var(--acc);border-radius:8px}
</style>
<link rel="stylesheet" href="assets/css/lesson.css">
<script src="assets/js/lesson.js" defer></script>
</head>

<div id="hud">

<div id="act"></div>
