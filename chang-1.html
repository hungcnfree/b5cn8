<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khởi động: Thợ nhện công trường</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e9f3ff;--ink:#12263f;--card:#fff;--cink:#12263f;--line:#1c3a5e;--bub:#fff8dc;--acc:#ff8a00;--shade:rgba(10,25,45,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1726;--ink:#eaf2ff;--card:#1b2a40;--cink:#eaf2ff;--line:#a8cdf5;--bub:#2b2a17}}
:root[data-theme="dark"]{--bg:#0d1726;--ink:#eaf2ff;--card:#1b2a40;--cink:#eaf2ff;--line:#a8cdf5;--bub:#2b2a17}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column}
#say{display:flex;gap:8px;align-items:center;background:var(--bub);color:var(--ink);padding:8px 10px;border-bottom:3px solid var(--acc);min-height:60px;font-size:clamp(13px,3.6vw,17px);line-height:1.35}
#tx{flex:1;font-weight:600}
button{font:inherit;cursor:pointer}
#rep{border:0;background:transparent;font-size:20px;color:var(--ink)}
#clk{width:54px;height:54px;border-radius:50%;background:var(--card);color:var(--cink);border:4px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1;flex:none}
#clk b{font-size:21px}#clk i{font-size:10px;font-style:normal;font-weight:700;margin-top:2px}
#clk.warn{border-color:#ff8a00;animation:cp 1s ease-in-out infinite}
#clk.dang{border-color:#e02020;background:#ffe3e3;color:#b00000;animation:cp .4s ease-in-out infinite}
@keyframes cp{50%{scale:1.18}}
#alarm{position:fixed;inset:0;z-index:20;pointer-events:none}
#alarm.on{animation:al 1s ease-in-out infinite}#alarm.fast{animation-duration:.45s}
@keyframes al{0%,100%{box-shadow:inset 0 0 30px 4px rgba(255,30,30,.12)}50%{box-shadow:inset 0 0 70px 20px rgba(255,30,30,.6)}}
.btn2{background:var(--card);color:var(--cink);border:2px solid var(--acc);margin-left:6px}
#stage{flex:1;position:relative;overflow:hidden;min-height:0}
#bg,#web,#lane{position:absolute;inset:0;width:100%;height:100%}
#lane{z-index:2}#web{pointer-events:none;z-index:3}
.w{fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;filter:drop-shadow(0 0 2px #0008);transition:stroke-dashoffset .35s ease-out,opacity .3s;opacity:0}
#hero{position:absolute;pointer-events:none;z-index:1;animation:bob 2.2s ease-in-out infinite}#hero img{display:block;width:100%;height:auto}#ledge{position:absolute;z-index:1;height:10px;border-radius:3px;background:linear-gradient(#ffb74d,#e07b00);box-shadow:0 3px 0 #8a4b00}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes jump{30%{transform:translateY(-16px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
@keyframes drift{to{transform:translateX(60px)}}
.cl{animation:drift 14s ease-in-out infinite alternate}.cl2{animation:drift 20s ease-in-out infinite alternate-reverse}
#hero.cheer{animation:jump .7s}
.it{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);color:var(--cink);border:2.5px solid var(--line);border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.25);will-change:transform;cursor:pointer;line-height:1.2;font-weight:600;padding:4px 6px}
.it svg{width:84%;height:84%;fill:none;stroke:var(--cink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.it.sel{border-color:var(--acc);box-shadow:0 0 0 4px #ff8a0088}
.it.glow{animation:gl 1s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 6px #2fd09a99}}
.it.shake{animation:sh .4s}
@keyframes sh{25%{margin-left:-6px}75%{margin-left:6px}}
.it.out{transition:opacity .35s,scale .35s;opacity:0;scale:.2}
#bag{height:64px;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--card);color:var(--cink);border-top:3px solid var(--line)}
#bag>span{font-weight:700;font-size:14px}
#chips{display:flex;gap:8px}
.chip{width:46px;height:46px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center}
.chip.has{border-style:solid;animation:pop .4s;cursor:pointer}
.chip.new{border-color:var(--acc);box-shadow:0 0 0 3px #ff8a0088}
.chip svg{width:34px;height:34px;fill:none;stroke:var(--cink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{scale:.3}70%{scale:1.2}}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--shade);padding:16px;z-index:9}
.hide{display:none}
.box{background:var(--card);color:var(--cink);border:3px solid var(--acc);border-radius:16px;padding:18px;max-width:380px;text-align:center}
.box h1{font-size:20px;margin:0 0 8px}
.box p{margin:0 0 12px;line-height:1.45}
.box svg{width:110px;height:110px;fill:none;stroke:var(--cink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{background:var(--acc);color:#1b1200;border:0;border-radius:999px;padding:10px 22px;font-weight:700}
</style>
<link rel="stylesheet" href="assets/css/lesson.css">
<script src="assets/js/lesson.js" defer></script>
</head>
<body>
<div id="app">
<div id="alarm"></div><div id="say"><span id="tx">Thợ nhện công trường</span><button id="rep" aria-label="Nghe lại">🔊</button><div id="clk"><b id="cn">30</b><i id="ci">giây</i></div></div>
<div id="stage">
<svg id="bg" viewBox="0 0 400 700" preserveAspectRatio="xMinYMid slice" aria-hidden="true">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#d9f0ff"/></linearGradient>
<pattern id="lat" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M0 0H34V34H0ZM0 0L34 34M34 0L0 34" fill="none" stroke="#c76b00" stroke-width="2"/></pattern>
<pattern id="scf" width="40" height="36" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V36" stroke="#6b7b8f" stroke-width="2.5" fill="none"/></pattern>
</defs>
<rect width="400" height="700" fill="url(#sky)"/>
<circle cx="330" cy="90" r="30" fill="#ffe27a"/>
<g fill="#fff" opacity=".9"><g class="cl"><ellipse cx="120" cy="150" rx="40" ry="14"/><ellipse cx="150" cy="140" rx="26" ry="14"/></g><g class="cl2"><ellipse cx="270" cy="230" rx="36" ry="12"/><ellipse cx="296" cy="222" rx="22" ry="12"/></g></g>
<g fill="#9fb4c9"><rect x="120" y="470" width="60" height="170"/><rect x="190" y="430" width="50" height="210"/><rect x="250" y="500" width="70" height="140"/></g>
<rect x="300" y="380" width="100" height="260" fill="url(#scf)" opacity=".8"/>
<g id="crane"><rect x="10" y="60" width="34" height="580" fill="url(#lat)"/>
<rect x="8" y="60" width="4" height="580" fill="#ff8a00"/><rect x="42" y="60" width="4" height="580" fill="#ff8a00"/>
<rect x="0" y="48" width="330" height="14" fill="#ff8a00"/>
<path d="M27 48L27 14L120 48M27 14L240 48" stroke="#ff8a00" stroke-width="4" fill="none"/>
<rect x="2" y="26" width="26" height="22" fill="#c76b00"/>
<path d="M290 62V150" stroke="#444" stroke-width="2"/><rect x="282" y="150" width="16" height="10" fill="#444"/></g>
<rect x="0" y="640" width="400" height="60" fill="#8a6f4d"/><path d="M0 640H400" stroke="#6a5337" stroke-width="4"/>
</svg>
<div id="lane"></div>
<svg id="web"><path id="w1" class="w"/><path id="w2" class="w"/></svg>
<div id="ledge"></div><div id="hero"><img id="ph" alt="" draggable="false"></div>
<div id="start" class="ov"><div class="box"><h1>Thợ nhện công trường</h1><p>Em là siêu nhân nhện đang bám trên cần cẩu. Nhiệm vụ: ghép đúng kí hiệu với tên của nó.</p><button class="btn" id="go">Bắt đầu thong thả</button><button class="btn btn2" id="go2">Thử thách 30 giây</button></div></div>
<div id="pop" class="ov hide"></div>
<div id="end" class="ov hide"></div>
</div>
<div id="bag"><span>Túi</span><div id="chips"><div class="chip" id="ca"></div><div class="chip" id="cb"></div><div class="chip" id="cc"></div><div class="chip" id="cd"></div></div></div>
</div>

function say(t,cb){last=t;$('#tx').textContent=t;if(au){au.pause();au=null}const u=MCA[t];if(u){au=new Audio(u);if(cb)au.onended=cb;au.play().catch(()=>{if(cb)setTimeout(cb,1200+t.length*50)})}else if(cb)setTimeout(cb,1200+t.length*50)}
$('#rep').onclick=()=>say(last);
let ac;
function snd(f,d,ty='sine',g=.12,f2){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
const stage=$('#stage'),lane=$('#lane'),hero=$('#hero'),items=[];
let W,H,S,TW,SX,TX,LS=600,run=false,sS=null,sT=null,busy=false,got=0,fin=false,t0=0,tEnd=0,stopT=false,over=false,lastK=99,SC=1,started=false;const miss={},learned=new Set();
function geo(){W=stage.clientWidth;H=stage.clientHeight;const s=Math.max(W/400,H/700),hw=Math.min(Math.max(W*.26,84),130),hh=hw*AR,lf=27*s+.3*hw-HF*hw,bt=H*.62;SC=s;
hero.style.width=hw+'px';hero.style.left=lf+'px';hero.style.top=(bt-hh)+'px';
Object.assign($('#ledge').style,{left:(15*s)+'px',top:(bt-3)+'px',width:(lf+HF*hw+.35*hw-15*s)+'px'});
const z=lf+hw,aw=W-z;S=Math.min(Math.max(aw*.3,58),92);TW=Math.min(Math.max(aw*.5,120),230);SX=z+aw*.04;TX=Math.min(W-TW-6,z+aw*.42);LS=H+130;
items.forEach(it=>{const sy=it.kind==='sym';it.x=sy?SX:TX;Object.assign(it.el.style,{width:(sy?S:TW)+'px',height:(sy?S:Math.max(50,TW*.34))+'px'})})}
const sh=a=>a.sort(()=>Math.random()-.5);
function add(kind,id,ph,t){const el=document.createElement('div');el.className='it';el.setAttribute('role','button');
if(kind==='sym')el.innerHTML=svg(id);else{el.textContent=t;el.style.fontSize='clamp(11.5px,3.1vw,15px)'}
lane.appendChild(el);const it={kind,id,el,y:ph*LS-130,frozen:false,done:false};
el.addEventListener('pointerdown',e=>{e.preventDefault();pick(it)});items.push(it)}
function build(){const K=Object.keys(SYM);
sh(K.slice()).forEach((k,i)=>add('sym',k,i/4));
sh([...K.map(k=>({id:k,t:SYM[k].n})),{id:'x1',t:'Cửa đi đơn một cánh'},{id:'x2',t:'Mái nhà'}]).forEach((o,i)=>add('txt',o.id,(i+.5)/6,o.t))}
let tp=0;
function loop(t){const dt=Math.min((t-tp)/1000,.05);tp=t;
for(const it of items){if(it.done)continue;if(run&&!it.frozen){it.y+=26*dt;if(it.y>H)it.y-=LS}it.el.style.transform=`translate(${it.x}px,${it.y}px)`}tick(t);
requestAnimationFrame(loop)}
const TL=30;
function sos(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime+.02;[.1,.1,.1,.3,.3,.3,.1,.1,.1].forEach(d=>{const o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=880;v.gain.setValueAtTime(.07,t);v.gain.setValueAtTime(0,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.01);t+=d+.09})}catch(e){}}
function tick(t){let amp=0;
if(run&&started&&!stopT&&!over&&chal){const rem=Math.max(0,TL-(performance.now()-t0)/1000),k=Math.ceil(rem);
$('#cn').textContent=k;$('#ci').textContent=rem<=10?'SOS':'giây';
$('#clk').className=rem<=5?'dang':rem<=10?'warn':'';
$('#alarm').className=rem<=5?'on fast':rem<=10?'on':'';
amp=rem<15?(15-rem)/15:0;
if(rem<=10&&k!==lastK&&(10-k)%3===0){lastK=k;sos();if(k===10)say(L.warn)}
if(rem<=0)timeUp()}
const f=t/1000*(9+amp*24),dx=Math.sin(f)*amp*2.6;
$('#crane').setAttribute('transform',`translate(${dx} 0) rotate(${Math.sin(f*1.3)*amp*1.5} 27 640)`);
const px=dx*SC*.6+'px 0';hero.style.translate=px;$('#ledge').style.translate=px}
function win(){const sec=((tEnd-t0)/1000).toFixed(1).replace('.',',');

const e=$('#end');e.innerHTML=`<div class="box"><h1>Hoàn thành!</h1><p>Thời gian: <b>${sec} giây</b></p><p>${L.win}</p><button class="btn" id="vw">Xem các kí hiệu ▶</button></div>`;e.classList.remove('hide');

function timeUp(){over=true;run=false;busy=true;clr();[sS,sT].forEach(i=>i&&i.el.classList.remove('sel'));sS=sT=null;

const e=$('#end');e.innerHTML=`<div class="box"><h1>Hết giờ rồi!</h1><p>Em thu được ${got}/4 kí hiệu. Em thử lại nhé.</p><button class="btn" id="rt">Chơi lại</button><button class="btn btn2" id="sk">Xem các kí hiệu</button></div>`;e.classList.remove('hide');

const clr=()=>['#w1','#w2'].forEach(s=>$(s).style.opacity=0);

web('#w1',hx,hy,A);web('#w2',hx,hy,B);snd(900,.2,'square',.05,300);setTimeout(judge,520)}
function judge(){if(over)return;const a=sS,b=sT,ok=a.id===b.id;

setTimeout(()=>{hero.classList.remove('cheer');pose(got===3?'cheer':'idle');clr();a.el.remove();b.el.remove();bagAdd(a.id);got++;sS=sT=null;busy=false;if(got===4&&!over)win()},700)}
else{snd(220,.25,'sawtooth',.06,140);pose('puz');[a,b].forEach(i=>i.el.classList.add('shake'));

setTimeout(()=>{pose('idle');[a,b].forEach(i=>{i.el.classList.remove('shake','sel');i.frozen=false});clr();sS=sT=null;busy=false},650)}}
function bagAdd(id){const c=$('#c'+id);c.innerHTML=svg(id);c.classList.add('has','new');c.onclick=()=>show(id)}

function show(id){const p=$('#pop');p.innerHTML=`<div class="box">${svg(id)}<h1>${SYM[id].n}</h1><p>Kí hiệu bộ phận: <b>${SYM[id].p}</b> của ngôi nhà.</p><button class="btn" id="ok">Đã hiểu</button></div>`;p.classList.remove('hide');

function theEnd(){const e=$('#end');e.innerHTML=`<div class="box"><h1>Các kí hiệu của ngôi nhà</h1><p>${L.end}</p><button class="btn" id="nx">Sang mục I ▶</button></div>`;e.classList.remove('hide');say(L.end);

let chal=false;const go=c=>{chal=c;$('#clk').style.display=c?'flex':'none';$('#start').classList.add('hide');run=true;snd(440,.05,'sine',.02);say(L.intro,()=>{if(!started)say(L.task,()=>setTimeout(()=>{if(!started)say(L.how)},6000))})};$('#go').onclick=()=>go(false);$('#go2').onclick=()=>go(true);
